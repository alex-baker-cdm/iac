name: Validate Infrastructure

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.tf'
      - '**.json'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.tf'
      - '**.json'

permissions:
  contents: read

jobs:
  validate-cloudformation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        continue-on-error: true
      
      - name: Validate CloudFormation templates
        run: |
          echo "Validating CloudFormation templates..."
          for file in AWS/*.yml; do
            if [ -f "$file" ]; then
              echo "Validating $file"
              aws cloudformation validate-template --template-body file://$file || true
            fi
          done
        continue-on-error: true

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.0
      
      - name: Terraform Format
        run: terraform fmt -check -recursive .
        continue-on-error: true
      
      - name: Terraform Validate
        run: |
          echo "Validating Terraform configurations..."
          for dir in Basic Examples; do
            if [ -d "$dir" ] && [ -f "$dir/main.tf" ]; then
              echo "Validating $dir"
              cd $dir
              terraform init -backend=false
              terraform validate || true
              cd ..
            fi
          done
        continue-on-error: true

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          for file in $(find . -name '*.json' -type f); do
            echo "Validating $file"
            python3 -m json.tool "$file" > /dev/null 2>&1 || echo "Invalid JSON: $file"
          done

  lint-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '18'
      
      - name: Lint JavaScript files
        run: |
          npm install -g eslint
          for file in $(find . -name '*.js' -type f); do
            echo "Linting $file"
            eslint "$file" || true
          done
        continue-on-error: true
